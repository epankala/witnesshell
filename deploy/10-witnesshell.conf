# /etc/ssh/sshd_config.d/10-witnesshell.conf
# Always run "sshd -t" before reloading: a mistake here locks everyone out.

# Only possible for all users; this is also the default.
PermitUserEnvironment no

# Members of group witnesshell get witnesshell and nothing else.
Match Group witnesshell
	ForceCommand /usr/local/bin/witsh bootstrap
	DisableForwarding yes
	PermitTunnel no
	PermitUserRC no
	# Keys where users cannot add any: one root-owned file per user.
	AuthorizedKeysFile /etc/ssh/authorized_keys/%u
